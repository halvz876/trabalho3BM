<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="estilo.css">
    <title>PÁGINA DE LOGIN E GERENCIAMENTO DE USUÁRIOS</title>
</head>
<body>

    <!-- ============================================================ -->
    <!-- 1. FORMULÁRIO DE LOGIN                                       -->
    <!-- ============================================================ -->
    <form id="formLogin">
        <fieldset id="fie">
            <legend>LOGIN</legend>
            <p>
                <label>Login (Email): </label>
                <input type="email" id="loginEmail" required>
            </p>
            <p>
                <label>SENHA :</label>
                <input type="password" id="loginSenha" required>
            </p>
            <center>
                <button type="submit">FAZER LOGIN</button>
            </center>
        </fieldset>
    </form>

    <!-- ============================================================ -->
    <!-- 2. FORMULÁRIO DE CADASTRO                                    -->
    <!-- ============================================================ -->
    <form id="formCadastro">
        <fieldset id="cad">
            <legend>CASO NÃO TENHA LOGIN, CADASTRE-SE</legend>
            <p>
                <label>Nome</label>
                <input type="text" id="cadastroNome" required>
            </p>
            <p>
                <label>Email</label>
                <input type="email" id="cadastroEmail" required>
            </p>
            <p>
                <label>Senha</label>
                <input type="password" id="cadastroSenha" required>
            </p>
            <center>
                <button type="submit">CADASTRE-SE</button>
                <input type="reset" value="Limpar">
            </center>
        </fieldset>
    </form>

    <!-- ============================================================ -->
    <!-- 3. FORMULÁRIO DE EDIÇÃO DE REGISTRO                         -->
    <!-- ============================================================ -->
    <form id="formEditar">
        <fieldset id="editConta">
            <legend>EDITAR MEUS DADOS</legend>
            <p>
                <label>E-mail Atual:</label>
                <input type="email" id="editEmailAuth" required>
            </p>
            <p>
                <label>Senha Atual:</label>
                <input type="password" id="editSenhaAuth" required>
            </p>
            <center style="margin-bottom: 15px;">
                <button type="button" id="btnCarregarDados">CARREGAR DADOS</button>
            </center>

            <p>
                <label>Novo Nome:</label>
                <input type="text" id="editNome" disabled required>
            </p>
            <center>
                <button type="submit" id="btnAtualizar" disabled>SALVAR ALTERAÇÕES</button>
            </center>
        </fieldset>
    </form>

    <!-- ============================================================ -->
    <!-- 4. EXCLUIR CONTA COMPLETA (AUTH + FIRESTORE)                 -->
    <!-- ============================================================ -->
    <form id="formDeletarContaPropria">
        <fieldset id="delConta">
            <legend>EXCLUIR MINHA CONTA COMPLETA</legend>
            <p>
                <label>E-mail:</label>
                <input type="email" id="deletarEmailAuth" required>
            </p>
            <p>
                <label>Senha:</label>
                <input type="password" id="deletarSenhaAuth" required>
            </p>
            <center>
                <button type="submit">
                    EXCLUIR MINHA CONTA PERMANENTEMENTE
                </button>
            </center>
        </fieldset>
    </form>

    <!-- VÍNCULO COM O ARQUIVO JAVASCRIPT SEPARADO -->
    <script type="module" src="app.js"></script>
</body>
</html>
